<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>体育馆座席视线与安检动线三维图</title>
  <link rel="stylesheet" href="./src/styles/main.css" />
</head>
<body>
  <div id="app">
    <canvas id="scene-canvas"></canvas>

    <div id="view-preview" class="view-preview hidden">
      <canvas id="preview-canvas"></canvas>
      <div class="preview-info">
        <div class="preview-title" id="preview-title">座席视角</div>
        <div class="preview-detail" id="preview-detail"></div>
      </div>
      <button class="preview-close" id="preview-close">×</button>
    </div>

    <div class="control-panel">
      <div class="panel-header">
        <h2>体育馆三维视图</h2>
        <div class="scene-switcher">
          <button class="scene-btn active" data-scene="concert">演唱会</button>
          <button class="scene-btn" data-scene="game">比赛</button>
          <button class="scene-btn" data-scene="family">亲子活动</button>
        </div>
      </div>

      <div class="panel-section">
        <div class="section-title">视图模式</div>
        <div class="view-mode-group">
          <button class="mode-btn active" data-mode="overview">总览</button>
          <button class="mode-btn" data-mode="ticket">票务视角</button>
          <button class="mode-btn" data-mode="operation">场馆运营</button>
          <button class="mode-btn" data-mode="audience">观众服务</button>
        </div>
      </div>

      <div class="panel-section">
        <div class="section-title">应急疏散模拟</div>
        <div id="evac-panel" class="evac-panel">
          <div class="evac-event-triggers">
            <button class="evac-trigger-btn fire" data-event="fire">🔥 火警</button>
            <button class="evac-trigger-btn terror" data-event="terror">⚠️ 恐怖威胁</button>
            <button class="evac-trigger-btn equipment" data-event="equipment">⚡ 设备故障</button>
            <button class="evac-trigger-btn general" data-event="general">🚨 综合应急</button>
          </div>
          <div class="evac-controls">
            <button class="evac-ctrl-btn" id="evac-stop" disabled>⏹ 停止</button>
            <button class="evac-ctrl-btn" id="evac-reset">↻ 重置</button>
            <span class="evac-status inactive" id="evac-status">未启动</span>
          </div>

          <div class="evac-progress-section" id="evac-progress-section" style="display:none;">
            <div class="evac-progress-bar-container">
              <div class="evac-progress-bar" id="evac-progress-bar" style="width:0%"></div>
            </div>
            <div class="evac-progress-stats">
              <span id="evac-evacuated">已疏散: 0</span>
              <span id="evac-remaining">剩余: 0</span>
              <span id="evac-time">用时: 0s</span>
            </div>
          </div>

          <div class="evac-exit-section" id="evac-exit-section" style="display:none;">
            <div class="evac-sub-title">出口实时状态</div>
            <div id="evac-exit-info" class="evac-exit-info"></div>
          </div>

          <div class="evac-bottleneck-section" id="evac-bottleneck-section" style="display:none;">
            <div class="evac-sub-title">瓶颈预警与建议</div>
            <div id="evac-bottleneck-info" class="evac-bottleneck-info"></div>
          </div>

          <div class="evac-strategy-section" id="evac-strategy-section" style="display:none;">
            <div class="evac-sub-title">疏散策略调整</div>
            <div class="evac-strategy-actions">
              <button class="evac-action-btn" id="evac-open-bypass">🔓 开启备用出口</button>
              <button class="evac-action-btn" id="evac-adjust-gate">🔄 调整闸机方向</button>
              <button class="evac-action-btn" id="evac-guide-accessible">♿ 引导至无障碍通道</button>
            </div>
            <button class="evac-snapshot-btn" id="evac-snapshot">📷 记录当前策略快照</button>
            <div id="evac-strategy-comparison" class="evac-strategy-comparison" style="display:none;">
              <div class="evac-sub-title">策略对比</div>
              <canvas id="evac-curve-canvas" width="280" height="160"></canvas>
              <div id="evac-strategy-legend" class="evac-strategy-legend"></div>
            </div>
          </div>

          <div class="evac-report-section" id="evac-report-section" style="display:none;">
            <button class="evac-report-btn" id="evac-show-report">📊 查看疏散报告</button>
          </div>
        </div>
      </div>

      <div class="panel-section">
        <div class="section-title">图层控制</div>
        <div class="layer-group">
          <label class="layer-item">
            <input type="checkbox" id="layer-seats" checked />
            <span>座席</span>
          </label>
          <label class="layer-item">
            <input type="checkbox" id="layer-seat-labels" />
            <span>座席标签</span>
          </label>
          <label class="layer-item">
            <input type="checkbox" id="layer-obstructions" checked />
            <span>遮挡物体</span>
          </label>
          <label class="layer-item">
            <input type="checkbox" id="layer-sight-lines" />
            <span>视线线段</span>
          </label>
          <label class="layer-item">
            <input type="checkbox" id="layer-sight-cone" />
            <span>视线锥</span>
          </label>
          <label class="layer-item">
            <input type="checkbox" id="layer-obstruction-markers" />
            <span>遮挡标记</span>
          </label>
          <label class="layer-item">
            <input type="checkbox" id="layer-heatmap" />
            <span>遮挡热区</span>
          </label>
          <label class="layer-item">
            <input type="checkbox" id="layer-entries" checked />
            <span>入口</span>
          </label>
          <label class="layer-item">
            <input type="checkbox" id="layer-security" checked />
            <span>安检口</span>
          </label>
          <label class="layer-item">
            <input type="checkbox" id="layer-channels" checked />
            <span>通道</span>
          </label>
          <label class="layer-item">
            <input type="checkbox" id="layer-accessible" checked />
            <span>无障碍区</span>
          </label>
          <label class="layer-item">
            <input type="checkbox" id="layer-vendors" checked />
            <span>售卖点</span>
          </label>
          <label class="layer-item">
            <input type="checkbox" id="layer-restrooms" checked />
            <span>卫生间</span>
          </label>
          <label class="layer-item">
            <input type="checkbox" id="layer-exits" checked />
            <span>疏散出口</span>
          </label>
          <label class="layer-item">
            <input type="checkbox" id="layer-flow-paths" />
            <span>人流动线</span>
          </label>
          <label class="layer-item">
            <input type="checkbox" id="layer-heat-zones" />
            <span>排队热区</span>
          </label>
        </div>
      </div>

      <div class="panel-section">
        <div class="section-title">分区渲染</div>
        <div class="zone-group">
          <label class="zone-item">
            <input type="checkbox" class="zone-toggle" data-zone="north" checked />
            <span class="zone-color north"></span>
            <span>北区</span>
          </label>
          <label class="zone-item">
            <input type="checkbox" class="zone-toggle" data-zone="south" checked />
            <span class="zone-color south"></span>
            <span>南区</span>
          </label>
          <label class="zone-item">
            <input type="checkbox" class="zone-toggle" data-zone="east" checked />
            <span class="zone-color east"></span>
            <span>东区</span>
          </label>
          <label class="zone-item">
            <input type="checkbox" class="zone-toggle" data-zone="west" checked />
            <span class="zone-color west"></span>
            <span>西区</span>
          </label>
        </div>
      </div>

      <div class="panel-section">
        <div class="section-title">座席信息</div>
        <div id="seat-info" class="seat-info">
          <div class="info-empty">点击座席查看详情</div>
        </div>
      </div>

      <div class="panel-section">
        <div class="section-title">视线分析与遮挡等级</div>
        <div id="sight-analysis" class="sight-analysis">
          <div class="info-empty">选择座席查看视线分析</div>
        </div>
      </div>

      <div class="panel-section">
        <div class="section-title">安检排队模拟</div>
        <div id="queue-panel" class="queue-panel">
          <div class="sim-controls">
            <button class="sim-btn" id="sim-start">▶ 开始</button>
            <button class="sim-btn" id="sim-stop">⏸ 暂停</button>
            <button class="sim-btn" id="sim-reset">↻ 重置</button>
            <span class="sim-status stopped" id="sim-status">已停止</span>
          </div>
          
          <div class="queue-section">
            <div class="queue-section-title">入口排队人数</div>
            <div id="entry-queue-info" class="entry-queue-info"></div>
          </div>
          
          <div class="queue-section">
            <div class="queue-section-title">安检通道控制</div>
            <div id="gate-controls" class="gate-controls"></div>
          </div>
          
          <div class="queue-section">
            <div class="queue-section-title">运营调整</div>
            <div class="operator-controls">
              <button class="operator-btn" id="add-volunteer">+ 添加志愿者</button>
              <button class="operator-btn" id="remove-volunteer">- 移除志愿者</button>
              <div class="operator-info" id="volunteer-info">当前志愿者: 0人</div>
            </div>
            <div class="operator-controls">
              <button class="operator-btn" id="add-fence">+ 添加围栏</button>
              <button class="operator-btn" id="move-fence">↔ 移动围栏</button>
              <button class="operator-btn" id="remove-fence">- 移除围栏</button>
              <div class="operator-info" id="fence-info">当前围栏: 0处</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="stats-panel">
      <div class="stat-item">
        <div class="stat-label">总座席数</div>
        <div class="stat-value" id="stat-total-seats">12,000</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">可售座席</div>
        <div class="stat-value" id="stat-available-seats">9,800</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">无障碍座席</div>
        <div class="stat-value" id="stat-accessible-seats">120</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">安检口</div>
        <div class="stat-value" id="stat-security">8</div>
      </div>
    </div>
  </div>

    </div>

    <div id="evac-report-modal" class="evac-report-modal" style="display:none;">
      <div class="evac-report-content">
        <div class="evac-report-header">
          <h3>应急疏散报告</h3>
          <button class="evac-report-close" id="evac-report-close">×</button>
        </div>
        <div id="evac-report-body" class="evac-report-body"></div>
      </div>
    </div>

    <div id="evac-alert-overlay" class="evac-alert-overlay" style="display:none;">
      <div class="evac-alert-content">
        <div class="evac-alert-icon" id="evac-alert-icon">🚨</div>
        <div class="evac-alert-text" id="evac-alert-text">应急疏散已启动</div>
      </div>
    </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
